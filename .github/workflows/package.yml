name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build deb
        run: packaging/deb/build.sh

      - name: Build rpm
        run: packaging/rpm/build.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/package/*.deb dist/
          cp target/package/*.rpm dist/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: bepr-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos pkg
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build pkg
        run: packaging/macos/build.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: bepr-macos-pkg
          path: target/package/*.pkg
          if-no-files-found: error
