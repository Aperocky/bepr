name: package

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    name: deb ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential curl dpkg-dev openssh-client pkg-config

      - name: Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: |
          . "$HOME/.cargo/env"
          cargo test --locked

      - name: Build release binary
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked

      - name: Build deb
        run: packaging/deb/build.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/package/*.deb dist/

      - name: Upload deb packages
        uses: actions/upload-artifact@v4
        with:
          name: bepr-deb-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  rpm:
    name: rpm ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build rpm
        run: packaging/rpm/build.sh

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/package/*.rpm dist/

      - name: Upload rpm packages
        uses: actions/upload-artifact@v4
        with:
          name: bepr-rpm-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos pkg
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build pkg
        run: packaging/macos/build.sh

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: bepr-macos-pkg
          path: target/package/*.pkg
          if-no-files-found: error

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [deb, rpm, macos]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bepr-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
