[package]
name = "bepr-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64ct = { version = "1", default-features = false, features = ["alloc"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = { version = "0.2", default-features = false }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
