[package]
name = "bepr"
version = "0.1.0"
edition = "2024"
description = "A tiny authenticated client/server reverse shell over outbound WebSocket connections"
license = "MIT"
repository = "https://github.com/Aperocky/bepr"
exclude = [".*.swp", "*.orig"]

[dependencies]
base64ct = { version = "1", default-features = false, features = ["alloc"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = { version = "0.2", default-features = false }
tokio = { version = "1", default-features = false, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
